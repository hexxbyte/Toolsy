[package]
name = "toolsy"
version = "0.1.0"
edition = "2024"

[dependencies]
bzip2 = "0.6.1"
flate2 = "1.1.10"
live-region = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
sevenz-rust2 = "0.24.1"
tar = "0.4.46"
toml = "1.1.8"
wxdragon = { version = "0.9.23", default-features = false }
xz2 = "0.1.7"
zip = { version = "9.1.0", default-features = false, features = ["deflate", "bzip2", "zstd"] }
zstd = "0.14.3"

[build-dependencies]
embed-manifest = "1.5.1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
