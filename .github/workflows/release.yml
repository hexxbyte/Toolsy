name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Rename
        shell: pwsh
        run: Copy-Item target\release\toolsy.exe toolsy-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: toolsy-${{ matrix.arch }}
          path: toolsy-${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/toolsy-x64.exe dist/toolsy-arm64.exe --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
